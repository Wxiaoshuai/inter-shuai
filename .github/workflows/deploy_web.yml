name: "Deploy web"

on:
  push:
    tags:
      - web-v*
    
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: "Install dependencies"
        run: npm install
        working-directory: web

      - name: "Build project"
        run: npm run build
        working-directory: web

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist/

      - name: "Cp old dist to backup"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            rm -rf /var/www/dist.backup/
            mv /var/www/dist/ /var/www/dist.backup/

      - name: "Upload to yun server"
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "web/dist/"
          target: "/var/www/dist/"
          strip_components: 2