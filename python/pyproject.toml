[project]
name = "ai-rag-agent"
version = "0.1.0"
description = "RAG and Agent API Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ==================== Web 框架 ====================
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # ==================== 数据验证 ====================
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.28",

    # ==================== LangChain / LangGraph ====================
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",

    # ==================== 向量数据库 (Milvus) ====================
    "pymilvus>=2.3.0",
    "langchain-milvus>=0.0.4",

    # ==================== 文档加载 ====================
    "langchain-community[doc_completers]>=0.0.20",

    # ==================== 数据库 (MySQL) ====================
    "aiomysql>=0.2.0",

    # ==================== Excel/Word 文档处理 ====================
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "python-docx>=1.1.0",

    # ==================== 图表生成 ====================
    "matplotlib>=3.7.0,<3.10.0",

    # ==================== 工具类 ====================
    "httpx>=0.26.0",
    "numpy>=1.26.0",
    "dashscope>=1.25.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]